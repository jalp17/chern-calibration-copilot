[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "chern-calibration-copilot"
version = "0.1.0"
description = "Copiloto de calibracion cuantica — diagnostico de ruido sobre el numero de Chern"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "streamlit>=1.30",
    "openai>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["simulador*", "agente*", "demo*"]
